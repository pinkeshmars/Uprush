name: uprush
description: "Cultivate your best self with our whimsical habit tracker, designed to beautifully organize your daily tasks and celebrate every step of your self-improvement journey."
publish_to: "none"
version: 1.0.0

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.1.0
  firebase_core: ^4.1.0
  cloud_firestore: '>=5.5.0'
  firebase_auth: '>=5.3.3'
  provider: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/app_icon.png
  adaptive_icon_background: "#ffffff"
  min_sdk_android: 21

